l_english: 
ENG_lessons_of_the_great_war:0 "Lessons of the Great War"
ENG_lessons_of_the_great_war_desc:0 "The Great War left deep scars across the realm, but it also taught us invaluable military lessons. We must analyze past strategic mistakes to build a modern force capable of defending British interests."
ENG_rebuild_the_home_fleet:0 "Rebuild the Home Fleet"
ENG_rebuild_the_home_fleet_desc:0 "Rule Britannia! Britannia rules the waves. We must expand our naval dockyards and commission a modern fleet to secure the high seas and protect our island nation."
ENG_industrial_heartlands:0 "Industrial Heartlands"
ENG_industrial_heartlands_desc:0 "Yorkshire and the Midlands are the core engines of British industry. Expanding our factory network here will lay the foundation for total industrial readiness."
ENG_shadow_factory_scheme:0 "Shadow Factory Scheme"
ENG_shadow_factory_scheme_desc:0 "By secretly converting civilian manufacturing lines into potential war production centers, we ensure that our industry can shift to a wartime footing at a moment's notice."
ENG_mobilizecoalsteel:0 "Mobilize Coal & Steel"
ENG_mobilizecoalsteel_desc:0 "The mines of Wales and Scotland hold vast reserves of raw material. Intensifying resource extraction will feed our rapidly growing industrial complex."
ENG_the_fractured_crown:0 "The Fractured Crown"
ENG_the_fractured_crown_desc:0 "The aftermath of the Great War saw our global empire shatter into independent breakaways. The former colonies must be reminded of who built them and where their true allegiance lies."
ENG_subjugate_the_dominions:0 "Subjugate the Dominions"
ENG_subjugate_the_dominions_desc:0 "Canada, Australia, and South Africa turned their backs on the Crown during our hour of weakness. We shall issue a stern ultimatum: accept British administration once again or face total invasion."
ENG_reclaim_the_jewels:0 "Reclaim the Jewels"
ENG_reclaim_the_jewels_desc:0 "India was once the crown jewel of our global empire. We must restore direct imperial rule over the Indian subcontinent and crush any rebellious authorities."
ENG_force_the_atlantic_pact:0 "Force the Atlantic Pact"
ENG_force_the_atlantic_pact_desc:0 "Through diplomatic pressure and military posture, we will bind our former territories into a tight web of compliance and manpower contributions."
ENG_empire_restored:0 "Empire Restored"
ENG_empire_restored_desc:0 "The sun never sets on the British Empire once more! Reunified under the King's standard, our global authority is restored and unmatched."
ENG_reevaluating_the_european_order:0 "Re-Evaluating the European Order"
ENG_reevaluating_the_european_order_desc:0 "Europe remains volatile in the wake of the Great War. As we look across the Channel, it becomes clear that British foreign policy must assert itself aggressively once again."
ENG_the_royal_house_of_hanover:0 "The Royal House of Hanover"
ENG_the_royal_house_of_hanover_desc:0 "For generations, the British Crown maintained a personal union over Hanover. Germany's possession of these ancestral dynastic lands is a historical injustice that must be corrected."
ENG_secure_the_north_sea:0 "Secure the North Sea"
ENG_secure_the_north_sea_desc:0 "Before making moves on the European continent, we must fortify our coastline against potential German naval retaliations."
ENG_denounce_german_hegemony:0 "Denounce German Hegemony"
ENG_denounce_german_hegemony_desc:0 "We will no longer tolerate German dominance in Central Europe. Publicly calling out Berlin signals to the world that Britain is ready to challenge them."
ENG_the_hannoverian_ultimatum:0 "The Hannoverian Ultimatum"
ENG_the_hannoverian_ultimatum_desc:0 "The time for diplomacy is over. We demand the immediate return of Hanover to the British Crown. Should Berlin refuse, war will decide the fate of Europe."
ENG_beaten_but_not_defeated:0 "Beaten but not Defeated"
ENG_beaten_but_not_defeated_desc:0 "After the dominions exit from the kingdom, there is little to none hope of getting them back to the folds without an all-out war with them, and we can't affort that."
ENG_colonial_police:0 "Colonial Police"
ENG_colonial_police_desc:0 "We can't let resistance grow all around the Empire, so as a solution we should announce the Empirial Police of The Colonies."
ENG_recrown_the_emperor_of_india:0 "Re-Crown the Emperor of India"
ENG_recrown_the_emperor_of_india_desc:0 "We may not be able to fully annex India but we can crown an emperor that will work with us and manage the rebellions of Pakistan and industrialise India."
ENG_towards_a_global_empire:0 "Towards a Global Empire"
ENG_towards_a_global_empire_desc:0 "If we want to keep this empire of ours for a long time we need to work with every minority that lives in our land."
