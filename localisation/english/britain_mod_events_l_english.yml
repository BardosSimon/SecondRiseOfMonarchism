l_english:
 britain_mod_events.1.t:0 "The Fractured Crown"
 britain_mod_events.1.d:0 "The British Empire stands at a crossroads. Voices call for renewal, reform and a restoration of imperial prestige."
 britain_mod_events.1.a:0 "The Empire Endures"
 britain_mod_events.2.t:0 "The Imperial Proposal"
 britain_mod_events.2.d:0 "Britain has offered India a place at the heart of a renewed Empire under the Crown."
 britain_mod_events.2.a:0 "For King and Empire!"
 britain_mod_events.2.b:0 "India Shall Remain Free!"
 britain_mod_events.3.t:0 "India Rejects the Crown"
 britain_mod_events.3.d:0 "India has rejected our proposal. The Cabinet must decide how to respond."
 britain_mod_events.3.a:0 "Prepare for War"
 britain_mod_events.3.b:0 "Stand Down"
 britain_mod_events.4.t:0 "The Imperial Conference"
 britain_mod_events.4.d:0 "Representatives from across the Empire gather to discuss its future."
 britain_mod_events.4.a:0 "A United Empire"
 britain_mod_events.5.t:0 "The Sun Never Sets Again"
 britain_mod_events.5.d:0 "The British Empire has been restored to new prominence."
 britain_mod_events.5.a:0 "Glorious!"
 britain_mod_events.6.t:0 "Birth of the Imperial Federation"
 britain_mod_events.6.d:0 "A new federation binds the Dominions together."
 britain_mod_events.6.a:0 "A New Era"
 britain_mod_events.7.t:0 "The End of Empire"
 britain_mod_events.7.d:0 "The age of decolonization has begun."
 britain_mod_events.7.a:0 "History Marches On"
 britain_mod_events.8.t:0 "British Claims on Hanover"
 britain_mod_events.8.d:0 "Britain demands recognition of its Hanoverian claims."
 britain_mod_events.8.a:0 "Accept"
 britain_mod_events.8.b:0 "Refuse"
 britain_mod_events.9.t:0 "The German Response"
 britain_mod_events.9.d:0 "Germany has answered our demands."
 britain_mod_events.9.a:0 "Then We Fight"
 britain_mod_events.9.b:0 "Back Down"
 britain_mod_events.10.t:0 "The Hanover Ultimatum"
 britain_mod_events.10.d:0 "An ultimatum has been delivered."
 britain_mod_events.10.a:0 "Stand Firm"
 britain_mod_events.11.t:0 "War over Hanover"
 britain_mod_events.11.d:0 "Diplomacy has failed."
 britain_mod_events.11.a:0 "To Arms!"
 britain_mod_events.12.t:0 "A New European Focus"
 britain_mod_events.12.d:0 "Britain turns its attention back to Europe."
 britain_mod_events.12.a:0 "Forward"
 britain_mod_events.13.t:0 "The British Bomb"
 britain_mod_events.13.d:0 "British scientists have unlocked the power of the atom."
 britain_mod_events.13.a:0 "Remarkable"
 britain_mod_events.14.t:0 "Towards a Global Empire"
 britain_mod_events.14.d:0 "Britain seeks influence across the globe."
 britain_mod_events.14.a:0 "Proceed"
 britain_mod_events.15.t:0 "Little England"
 britain_mod_events.15.d:0 "The nation focuses on prosperity at home."
 britain_mod_events.15.a:0 "For Britain"
